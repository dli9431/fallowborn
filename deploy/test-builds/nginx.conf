# test.fallowborn.com: the root branch at / and every other pushed branch
# under /<name>/ (see build.sh). Test builds are never indexed. No service
# worker or install manifest ships here; the game enables those only on
# play.fallowborn.com.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~ /\. { deny all; }

    # A branch build that shares the root soundtrack has no music folder of
    # its own; serve the root copy for the same path.
    location ~ ^/[a-z0-9-]+/music/(.+)$ {
        default_type audio/ogg;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /music/$1 =404;
    }

    # Versioned assets: each build stamps its own ?v= key.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location ~* \.opus$ {
        default_type audio/ogg;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Build listings must reflect the latest deploy.
    location = /branches/builds.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Pages and everything else revalidate on every load.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }
}
