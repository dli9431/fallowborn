# Reusable Playwright run: syntax and support checks, a sharded browser
# suite and one merged report. Called by tests.yml (pushes, pull requests,
# manual runs) and nightly.yml (full suite per branch). The game is checked
# out at inputs.ref; the report tooling comes from the calling commit.
#
# rolling-all is the complete rolling suite: every discovered case, with no
# changed-file selection, packed into timing-balanced batches from the
# durations measured by earlier full runs of the same label (or, without
# them, the newest other label) and run under the 600 second batch cap by
# the calling commit's tests/e2e/support/ci-rolling.js, so any ref can be
# run. Each batch job's report is fetched on its own with retries, and the
# measured durations are saved as case-timings-<label> after every run.
# Batches run one browser worker, or two when workers is 2: a batch then
# holds two worker shares of measured work, and that run saves no
# durations, so one-worker planning keeps its own measurements.
name: E2E

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit to test
        type: string
        required: true
      label:
        description: Unique artifact label within the run
        type: string
        default: tests
      mode:
        description: changed (Playwright --only-changed against base), all, specs (only the listed specs), groups, rolling, rolling-plan, or rolling-all (every discovered case in timing-balanced batches)
        type: string
        default: changed
      specs:
        description: Space-separated spec paths relative to tests/e2e, required for specs mode and optional for changed mode
        type: string
        default: ''
      base:
        description: Base commit for changed mode; the parent commit when empty or unknown
        type: string
        default: ''
      projects:
        description: Space-separated Playwright projects, or all
        type: string
        default: all
      shards:
        type: number
        default: 4
      workers:
        description: Playwright workers per shard; rolling-all accepts 1 or 2 per batch, and its callers pass 1 unless a run asks for 2
        type: number
        default: 2
      bounded:
        description: Bound runtime dependencies to the boot and determinism canaries, as test:changed does
        type: boolean
        default: true
      report_source_run:
        description: Existing run id for report-only recovery; empty runs the suite
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  plan:
    if: ${{ inputs.report_source_run == '' }}
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      args: ${{ steps.select.outputs.args }}
      image: ${{ steps.plan.outputs.image }}
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          path: game
          fetch-depth: ${{ (inputs.mode == 'changed' || startsWith(inputs.mode, 'rolling')) && '0' || '1' }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
          sparse-checkout: |
            tests/e2e/support/ci-discovery.js
            tests/e2e/support/ci-rolling.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
        working-directory: game/tests/e2e
      - id: select
        name: Select tests
        working-directory: game/tests/e2e
        env:
          MODE: ${{ inputs.mode }}
          BASE: ${{ inputs.base }}
          PROJECTS: ${{ inputs.projects }}
          SPECS: ${{ inputs.specs }}
          WORKERS: ${{ inputs.workers }}
        run: |
          args=""
          if [ "$MODE" = rolling-all ] && [ -n "$SPECS" ]; then
            echo "rolling-all runs every discovered case and takes no specs" >&2; exit 2
          fi
          if [ "$MODE" = rolling-all ] && [ "$WORKERS" != 1 ] && [ "$WORKERS" != 2 ]; then
            echo "rolling-all runs 1 or 2 browser workers per batch, not $WORKERS" >&2; exit 2
          fi
          if [ "$MODE" = groups ]; then
            SPECS=$(jq -er 'if type == "array" and length > 0 and all(.[]; type == "array" and length > 0 and all(.[]; type == "string" and test("^specs/([a-zA-Z0-9_-]+/)*[a-zA-Z0-9_.-]+\\.spec\\.js$"))) then flatten | join(" ") else error("Invalid shard groups") end' <<< "$SPECS")
          fi
          if [ "$MODE" = specs ] || [ -n "$SPECS" ]; then
            for spec in $SPECS; do
              if [[ ! "$spec" =~ ^specs/([a-zA-Z0-9_-]+/)*[a-zA-Z0-9_.-]+\.spec\.js(:[1-9][0-9]*)?$ ]]; then
                echo "Invalid spec path or line: $spec" >&2; exit 2
              fi
              args="$args $spec"
            done
            if [ -z "$args" ]; then echo "specs mode needs specs" >&2; exit 2; fi
          fi
          if [[ "$MODE" = changed || ( "$MODE" = rolling* && "$MODE" != rolling-all ) ]]; then
            base="$BASE"
            if [[ "$MODE" = rolling* && -n "$base" && "$base" != 0000000000000000000000000000000000000000 ]]; then
              git cat-file -e "$base^{commit}" || { echo "Cannot resolve pushed base"; exit 1; }
            fi
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD~1)"
            fi
            base=$(git rev-parse --verify --end-of-options "$base^{commit}")
            echo "Changed-test base: $base"
            args="--only-changed=$base --pass-with-no-tests $args"
          fi
          if [ "$PROJECTS" != all ]; then
            for project in $PROJECTS; do
              case "$project" in
                chromium-file|chromium-served|firefox-served|webkit-served) args="$args --project=$project" ;;
                *) echo "Unknown project: $project" >&2; exit 2 ;;
              esac
            done
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Load recent 476 case durations
        continue-on-error: true
        if: startsWith(inputs.mode, 'rolling') && inputs.mode != 'rolling-all'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timing=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=case-timings-476&per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "476")] | first | .workflow_run.id // empty')
          if [[ -n "$timing" ]]; then
            gh run download "$timing" -R "$GITHUB_REPOSITORY" -n case-timings-476 -D "$RUNNER_TEMP/prior"
            jq -e 'type == "object" and all(.[]; type == "number" and . > 0)' "$RUNNER_TEMP/prior/case-timings.json" >/dev/null
            cp "$RUNNER_TEMP/prior/case-timings.json" "$RUNNER_TEMP/"
          else
            prior=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?branch=476&event=push&status=completed&per_page=1" --jq '.workflow_runs[0].id // empty')
            if [[ -n "$prior" ]]; then
              size=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$prior/artifacts?name=report-tests" --jq '[.artifacts[] | select(.expired == false)] | first | .size_in_bytes // 0')
              if (( size > 0 && size < 33554432 )); then
                gh run download "$prior" -R "$GITHUB_REPOSITORY" -n report-tests -D "$RUNNER_TEMP/prior"
                node tooling/tests/e2e/support/ci-rolling.js learn "$RUNNER_TEMP/prior/results.json"
              fi
            fi
          fi
      - name: Load recent case durations for this label
        continue-on-error: true
        if: inputs.mode == 'rolling-all'
        env:
          GH_TOKEN: ${{ github.token }}
          OWN: case-timings-${{ inputs.label }}
        run: |
          # The newest unexpired durations for this label, else the newest from
          # another label the workflows write. Case ids are stable across
          # branches, so shared cases keep their measured time and only cases
          # the donor never ran use the cold estimate. A full run uploads
          # hundreds of batch artifacts, so an unfiltered listing never reaches
          # older timing artifacts; ask for each label by name.
          newest() {
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.id != null)] | max_by(.created_at) | select(. != null) | "\(.created_at) \(.workflow_run.id) \(.name)"'
          }
          pick=$(newest "$OWN" || true)
          if [[ -z "$pick" ]]; then
            pick=$(for donor in case-timings-tests case-timings-476 case-timings-suite-476 case-timings-suite-dev; do
              if [[ "$donor" != "$OWN" ]]; then newest "$donor" || true; fi
            done | sort -r | head -n 1)
          fi
          if [[ -z "$pick" ]]; then
            echo "No measured case durations found; every case uses the cold estimate."
            exit 0
          fi
          read -r created run name <<< "$pick"
          echo "Planning with $name from run $run ($created)."
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$name" -D "$RUNNER_TEMP/prior"
          jq -e 'type == "object" and all(.[]; type == "number" and . > 0)' "$RUNNER_TEMP/prior/case-timings.json" >/dev/null
          cp "$RUNNER_TEMP/prior/case-timings.json" "$RUNNER_TEMP/"
      - id: plan
        working-directory: game/tests/e2e
        env:
          PLAYWRIGHT_ARGS: ${{ steps.select.outputs.args }}
          SHARD_GROUPS: ${{ inputs.mode == 'groups' && inputs.specs || '' }}
          CI_ROLLING: ${{ startsWith(inputs.mode, 'rolling') && '1' || '' }}
          # Planner and batch jobs read the same count; other rolling modes use one.
          FB_ROLLING_WORKERS: ${{ inputs.mode == 'rolling-all' && inputs.workers || '' }}
          WORKERS: ${{ inputs.workers }}
          FB_BOUNDED_CHANGED_RUNTIME_DEPENDENCIES: ${{ inputs.bounded && '1' || '0' }}
          SHARDS: ${{ inputs.shards }}
        run: |
          version=$(jq -er '.packages["node_modules/playwright-core"].version' package-lock.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"
          node "$GITHUB_WORKSPACE/tooling/tests/e2e/support/ci-discovery.js"
          if [[ -n "$CI_ROLLING" && -f "$RUNNER_TEMP/case-timings.json" ]]; then
            cp "$RUNNER_TEMP/case-timings.json" "$RUNNER_TEMP/ci-selection/"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: blob-${{ inputs.label }}-plan
          path: ${{ runner.temp }}/ci-selection
          retention-days: 5
          if-no-files-found: error

  check:
    # Arbitrary game refs must not populate shared dependency or browser caches.
    # A spec-only run (the task runner's targeted checks) is judged by its specs alone.
    # The changed rolling modes leave these checks to their regression gate; the
    # complete rolling suite runs them on its own game ref.
    if: ${{ inputs.report_source_run == '' && inputs.mode != 'specs' && inputs.mode != 'groups' && (!startsWith(inputs.mode, 'rolling') || inputs.mode == 'rolling-all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
        working-directory: tests/e2e
      - name: Syntax check
        run: npm run check
        working-directory: tests/e2e
      - name: Server and runner support tests
        run: npm run test:server
        working-directory: tests/e2e
      - name: Static HTML extraction tests
        run: python -m unittest test_i18n_catalog.JavascriptLexerTests test_i18n_catalog.StaticHtmlExtractionTests
        working-directory: tools

  e2e:
    if: ${{ inputs.report_source_run == '' && inputs.mode != 'rolling-plan' && needs.plan.outputs.shards != '[]' }}
    needs: plan
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.plan.outputs.image }}
      options: --user pwuser --init --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: ${{ (inputs.mode == 'rolling' || inputs.mode == 'rolling-all') && 120 || 20 }}
    strategy:
      max-parallel: ${{ (inputs.mode == 'rolling' || inputs.mode == 'rolling-all') && 16 || 256 }}
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
          # Only the changed-test selection needs history.
          fetch-depth: ${{ inputs.mode == 'changed' && '0' || '1' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
        working-directory: tests/e2e
      - uses: actions/download-artifact@v8
        if: inputs.mode == 'rolling' || inputs.mode == 'rolling-all'
        with:
          name: blob-${{ inputs.label }}-plan
          path: ${{ runner.temp }}/rolling-plan
      # The complete suite can run a ref without the current batch runner, so
      # batches use the calling commit's runner and compact reporter.
      - uses: actions/checkout@v7
        if: inputs.mode == 'rolling-all'
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
          sparse-checkout: |
            tests/e2e/support/ci-rolling.js
            tests/e2e/support/ci-report.js
          sparse-checkout-cone-mode: false
      - name: Run Playwright
        working-directory: tests/e2e
        env:
          SHARD_GROUPS: ${{ inputs.mode == 'groups' && inputs.specs || '' }}
          SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip
          PLAYWRIGHT_ARGS: ${{ needs.plan.outputs.args }}
          FB_BOUNDED_CHANGED_RUNTIME_DEPENDENCIES: ${{ inputs.bounded && '1' || '0' }}
          FB_ROLLING_WORKERS: ${{ inputs.mode == 'rolling-all' && inputs.workers || '' }}
        run: |
          if [[ "${{ inputs.mode == 'rolling' }}" = true ]]; then
            node support/ci-rolling.js "$RUNNER_TEMP/rolling-plan/rolling.json" "$SHARD"
            exit
          fi
          if [[ "${{ inputs.mode == 'rolling-all' }}" = true ]]; then
            node "$GITHUB_WORKSPACE/tooling/tests/e2e/support/ci-rolling.js" "$RUNNER_TEMP/rolling-plan/rolling.json" "$SHARD"
            exit
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          read -ra args <<< "$PLAYWRIGHT_ARGS"
          if [[ -n "$SHARD_GROUPS" ]]; then
            files=$(node -p 'JSON.parse(process.env.SHARD_GROUPS)[Number(process.env.SHARD) - 1].join(" ")')
            read -ra group <<< "$files"
            for arg in "${args[@]}"; do
              if [[ "$arg" == --project=* ]]; then group+=("$arg"); fi
            done
            args=("${group[@]}")
          else
            args+=("--shard=$SHARD/${{ inputs.shards }}")
          fi
          timeout --signal=INT --kill-after=30s 600s npx playwright test "${args[@]}" \
            --workers=${{ inputs.workers }} --reporter=blob,line
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ inputs.label }}-${{ matrix.shard }}
          path: tests/e2e/blob-report
          retention-days: 5
          if-no-files-found: ignore
      # Failure contexts (error-context.md, screenshots, traces) for test-fix triage.
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: results-${{ inputs.label }}-${{ matrix.shard }}
          path: tests/e2e/test-results
          retention-days: 14
          if-no-files-found: ignore

  report:
    needs: [plan, e2e]
    if: ${{ !cancelled() && inputs.mode != 'rolling-plan' && (inputs.report_source_run != '' || needs.plan.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tooling
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tooling/tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tooling/tests/e2e
      - uses: actions/download-artifact@v8
        if: inputs.mode != 'rolling-all'
        with:
          pattern: blob-${{ inputs.label }}-*
          path: blobs
          merge-multiple: true
          run-id: ${{ inputs.report_source_run || github.run_id }}
          github-token: ${{ github.token }}
      # The complete suite uploads one artifact per batch job, well over a
      # hundred. Fetching them in one step fails the whole report when a single
      # download does, so each is fetched on its own with retries. A batch that
      # still cannot be fetched is reported as missing coverage below.
      - name: Download batch reports
        if: inputs.mode == 'rolling-all'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.report_source_run || github.run_id }}
          LABEL: ${{ inputs.label }}
        run: |
          mkdir -p blobs downloads
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false) | select(.name | startswith(\"blob-${LABEL}-\")) | .name" > names.txt
          echo "$(wc -l < names.txt) report artifacts for blob-${LABEL}-*."
          fetch() {
            for attempt in 1 2 3 4 5; do
              rm -rf "downloads/$1"
              if gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "$1" -D "downloads/$1"; then return 0; fi
              sleep $((attempt * 5))
            done
            echo "::warning::Could not download artifact $1"
            return 1
          }
          export -f fetch
          export RUN_ID GITHUB_REPOSITORY
          xargs -a names.txt -P 8 -I{} bash -c 'fetch "$1"' _ {} || echo "::warning::Some batch artifacts could not be downloaded."
          shopt -s nullglob
          for dir in downloads/*/; do cp -r "$dir". blobs/; done
      - name: Check report coverage and size
        id: reports
        env:
          EXPECTED_SHARDS: ${{ inputs.shards }}
          SOURCE_RUN: ${{ inputs.report_source_run || github.run_id }}
          REPLAY: ${{ inputs.report_source_run }}
        run: |
          if [[ -z "$REPLAY" ]]; then test -f blobs/selection.json; fi
          if [[ -f blobs/rolling.json ]]; then
            EXPECTED_SHARDS=$(jq -e '(.batches | length) | if . == 0 then 1 else . end' blobs/rolling.json)
          fi
          echo "expected=$EXPECTED_SHARDS" >> "$GITHUB_OUTPUT"
          shopt -s nullglob
          report_files=(blobs/*.zip)
          echo "shards=${#report_files[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#report_files[@]}" -ne "$EXPECTED_SHARDS" ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Expected $EXPECTED_SHARDS shard reports, found ${#report_files[@]}. Available results are incomplete."
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "${#report_files[@]}" -eq 0 ]; then exit 1; fi
          total_bytes=$(du -cb "${report_files[@]}" | tail -1 | cut -f1)
          if [ "$total_bytes" -le 1073741824 ]; then
            echo "html=true" >> "$GITHUB_OUTPUT"
          else
            echo "html=false" >> "$GITHUB_OUTPUT"
            echo "HTML rendering omitted because blob inputs exceed 1 GiB. Compact results and shard coverage follow; screenshots and traces remain in the source run's per-shard results artifacts: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Merge compact results
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          FB_CI_REPORT_FILE: ${{ github.workspace }}/merged/results.json
          FB_CI_REPORT_EXPECTED_SHARDS: ${{ steps.reports.outputs.expected }}
          FB_CI_REPORT_RECEIVED_SHARDS: ${{ steps.reports.outputs.shards }}
          FB_CI_REPORT_SOURCE_RUN: ${{ inputs.report_source_run || github.run_id }}
          REF: ${{ inputs.ref }}
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p merged
          (cd tooling/tests/e2e && npx playwright merge-reports --config=playwright.config.js --reporter="$GITHUB_WORKSPACE/tooling/tests/e2e/support/ci-report.js" "$GITHUB_WORKSPACE/blobs")
          coverage_status=0
          if [[ -f blobs/selection.json ]]; then
            node tooling/tests/e2e/support/ci-discovery.js verify blobs/selection.json merged/results.json || coverage_status=$?
          fi
          node tooling/tests/e2e/support/ci-summary.js merged/results.json "$REF" "$MODE" >> "$GITHUB_STEP_SUMMARY"
          exit "$coverage_status"
      - name: Render bounded HTML report
        id: html
        if: ${{ steps.reports.outputs.html == 'true' }}
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/merged/html
        run: |
          (cd tooling/tests/e2e && npx playwright merge-reports --config=playwright.config.js --reporter=html "$GITHUB_WORKSPACE/blobs")
          if [ ! -d merged/html ] && [ -d tooling/tests/e2e/playwright-report ]; then
            cp -r tooling/tests/e2e/playwright-report merged/html
          fi
      - name: Note unavailable HTML rendering
        if: ${{ !cancelled() && steps.html.outcome == 'failure' }}
        run: |
          echo "::warning::HTML rendering failed; compact results, coverage metadata and per-shard artifacts remain available."
          echo "HTML rendering failed. Compact results, coverage metadata and per-shard failure artifacts remain available." >> "$GITHUB_STEP_SUMMARY"
      - name: Require complete shard coverage
        if: ${{ !cancelled() && steps.reports.outputs.complete != 'true' }}
        run: |
          echo "::error::Shard coverage is incomplete. Available compact results are diagnostic only."
          exit 1
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-${{ inputs.label }}
          path: merged
          retention-days: 14
          if-no-files-found: ignore

      - name: Update measured 476 case durations
        if: ${{ !cancelled() && inputs.mode == 'rolling' && github.event_name == 'push' && github.ref_name == '476' && hashFiles('merged/results.json') != '' }}
        run: |
          if [[ -f blobs/case-timings.json ]]; then cp blobs/case-timings.json "$RUNNER_TEMP/"; fi
          node tooling/tests/e2e/support/ci-rolling.js learn merged/results.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && inputs.mode == 'rolling' && github.event_name == 'push' && github.ref_name == '476' && hashFiles('merged/results.json') != '' }}
        with:
          name: case-timings-476
          path: ${{ runner.temp }}/case-timings.json
          retention-days: 30

      # Cases run slower beside a second browser worker, so only one-worker
      # runs update the durations that planning reads.
      - name: Update measured case durations for this label
        if: ${{ !cancelled() && inputs.mode == 'rolling-all' && inputs.workers == 1 && hashFiles('merged/results.json') != '' }}
        run: |
          if [[ -f blobs/case-timings.json ]]; then cp blobs/case-timings.json "$RUNNER_TEMP/"; fi
          node tooling/tests/e2e/support/ci-rolling.js learn merged/results.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && inputs.mode == 'rolling-all' && inputs.workers == 1 && hashFiles('merged/results.json') != '' }}
        with:
          name: case-timings-${{ inputs.label }}
          path: ${{ runner.temp }}/case-timings.json
          retention-days: 30
      - name: Note unsaved two-worker durations
        if: ${{ !cancelled() && inputs.mode == 'rolling-all' && inputs.workers != 1 }}
        env:
          LABEL: ${{ inputs.label }}
          WORKERS: ${{ inputs.workers }}
        run: |
          echo "Batches ran $WORKERS browser workers each, so this run's durations were not saved as case-timings-$LABEL; one-worker planning keeps its measurements. Per-case durations remain in report-$LABEL." >> "$GITHUB_STEP_SUMMARY"
