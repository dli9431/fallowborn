# Reusable Playwright run: syntax and support checks, a sharded browser
# suite and one merged report. Called by tests.yml (pushes, pull requests,
# manual runs) and nightly.yml (full suite per branch). The game is checked
# out at inputs.ref; the report tooling comes from the calling commit.
name: E2E

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit to test
        type: string
        required: true
      label:
        description: Unique artifact label within the run
        type: string
        default: tests
      mode:
        description: changed (Playwright --only-changed against base), all, or specs (only the listed specs)
        type: string
        default: changed
      specs:
        description: Space-separated spec paths relative to tests/e2e (specs mode)
        type: string
        default: ''
      base:
        description: Base commit for changed mode; the parent commit when empty or unknown
        type: string
        default: ''
      projects:
        description: Space-separated Playwright projects, or all
        type: string
        default: all
      shards:
        type: number
        default: 4
      workers:
        description: Playwright workers per shard
        type: number
        default: 2
      bounded:
        description: Bound runtime dependencies to the boot and determinism canaries, as test:changed does
        type: boolean
        default: true
      report_source_run:
        description: Existing run id for report-only recovery; empty runs the suite
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  plan:
    if: ${{ inputs.report_source_run == '' }}
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          list=""; i=1
          while [ "$i" -le "$SHARDS" ]; do list="$list${list:+,}$i"; i=$((i + 1)); done
          echo "shards=[$list]" >> "$GITHUB_OUTPUT"

  check:
    # A spec-only run (the task runner's targeted checks) is judged by its specs alone.
    if: ${{ inputs.report_source_run == '' && inputs.mode != 'specs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tests/e2e
      - name: Syntax check
        run: npm run check
        working-directory: tests/e2e
      - name: Server and runner support tests
        run: npm run test:server
        working-directory: tests/e2e

  e2e:
    if: ${{ inputs.report_source_run == '' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # Only the changed-test selection needs history.
          fetch-depth: ${{ inputs.mode == 'changed' && '0' || '1' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tests/e2e
      - id: pw
        working-directory: tests/e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium firefox webkit
      - id: select
        name: Select tests
        env:
          MODE: ${{ inputs.mode }}
          BASE: ${{ inputs.base }}
          PROJECTS: ${{ inputs.projects }}
          SPECS: ${{ inputs.specs }}
        run: |
          args=""
          if [ "$MODE" = specs ]; then
            for spec in $SPECS; do
              case "$spec" in
                specs/*.spec.js) args="$args $spec" ;;
                *) echo "Not a spec path: $spec" >&2; exit 2 ;;
              esac
            done
            if [ -z "$args" ]; then echo "specs mode needs specs" >&2; exit 2; fi
          elif [ "$MODE" = changed ]; then
            base="$BASE"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD~1)"
            fi
            echo "Changed-test base: $base"
            args="--only-changed=$base --pass-with-no-tests"
          fi
          if [ "$PROJECTS" != all ]; then
            for project in $PROJECTS; do args="$args --project=$project"; done
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Run Playwright
        working-directory: tests/e2e
        env:
          FB_BOUNDED_CHANGED_RUNTIME_DEPENDENCIES: ${{ inputs.bounded && '1' || '0' }}
        run: >-
          npx playwright test ${{ steps.select.outputs.args }}
          --shard=${{ matrix.shard }}/${{ inputs.shards }}
          --workers=${{ inputs.workers }}
          --reporter=blob
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-${{ inputs.label }}-${{ matrix.shard }}
          path: tests/e2e/blob-report
          retention-days: 5
          if-no-files-found: ignore
      # Failure contexts (error-context.md, screenshots, traces) for test-fix triage.
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: results-${{ inputs.label }}-${{ matrix.shard }}
          path: tests/e2e/test-results
          retention-days: 14
          if-no-files-found: ignore

  report:
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tooling/tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tooling/tests/e2e
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-${{ inputs.label }}-*
          path: blobs
          merge-multiple: true
          run-id: ${{ inputs.report_source_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Check report coverage and size
        id: reports
        env:
          EXPECTED_SHARDS: ${{ inputs.shards }}
          SOURCE_RUN: ${{ inputs.report_source_run || github.run_id }}
        run: |
          shopt -s nullglob
          report_files=(blobs/*.zip)
          echo "shards=${#report_files[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#report_files[@]}" -ne "$EXPECTED_SHARDS" ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Expected $EXPECTED_SHARDS shard reports, found ${#report_files[@]}. Available results are incomplete."
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "${#report_files[@]}" -eq 0 ]; then exit 1; fi
          total_bytes=$(du -cb "${report_files[@]}" | tail -1 | cut -f1)
          if [ "$total_bytes" -le 1073741824 ]; then
            echo "html=true" >> "$GITHUB_OUTPUT"
          else
            echo "html=false" >> "$GITHUB_OUTPUT"
            echo "HTML rendering omitted because blob inputs exceed 1 GiB. Compact results and shard coverage follow; screenshots and traces remain in the source run's per-shard results artifacts: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Merge compact results
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          FB_CI_REPORT_FILE: ${{ github.workspace }}/merged/results.json
          FB_CI_REPORT_EXPECTED_SHARDS: ${{ inputs.shards }}
          FB_CI_REPORT_RECEIVED_SHARDS: ${{ steps.reports.outputs.shards }}
          FB_CI_REPORT_SOURCE_RUN: ${{ inputs.report_source_run || github.run_id }}
          REF: ${{ inputs.ref }}
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p merged
          (cd tooling/tests/e2e && npx playwright merge-reports --reporter="$GITHUB_WORKSPACE/tooling/tests/e2e/support/ci-report.js" "$GITHUB_WORKSPACE/blobs")
          node tooling/tests/e2e/support/ci-summary.js merged/results.json "$REF" "$MODE" >> "$GITHUB_STEP_SUMMARY"
      - name: Render bounded HTML report
        id: html
        if: ${{ steps.reports.outputs.html == 'true' }}
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/merged/html
        run: |
          (cd tooling/tests/e2e && npx playwright merge-reports --reporter=html "$GITHUB_WORKSPACE/blobs")
          if [ ! -d merged/html ] && [ -d tooling/tests/e2e/playwright-report ]; then
            cp -r tooling/tests/e2e/playwright-report merged/html
          fi
      - name: Note unavailable HTML rendering
        if: ${{ !cancelled() && steps.html.outcome == 'failure' }}
        run: |
          echo "::warning::HTML rendering failed; compact results, coverage metadata and per-shard artifacts remain available."
          echo "HTML rendering failed. Compact results, coverage metadata and per-shard failure artifacts remain available." >> "$GITHUB_STEP_SUMMARY"
      - name: Require complete shard coverage
        if: ${{ !cancelled() && steps.reports.outputs.complete != 'true' }}
        run: |
          echo "::error::Shard coverage is incomplete. Available compact results are diagnostic only."
          exit 1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-${{ inputs.label }}
          path: merged
          retention-days: 14
          if-no-files-found: ignore
