name: Complete content timing
on:
  workflow_dispatch:
    inputs:
      timing_ref:
        description: Revision to measure
        required: true
        default: automation/v2
        type: string
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retain measurement driver
        run: cp tests/e2e/measure/content.js "$RUNNER_TEMP/content-measure.js"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.timing_ref }}
      - name: Install measurement driver
        run: mkdir -p tests/e2e/measure && cp "$RUNNER_TEMP/content-measure.js" tests/e2e/measure/content.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Profile complete preparation
        run: node tests/e2e/measure/content.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-timing
          path: tests/e2e/test-results/content-timing/
