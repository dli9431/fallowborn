# Nightly: the full Playwright suite on each listed branch, and season timing
# for every start on the timing branch. Runs from main on a schedule or by
# hand; each job checks out the branch it measures.
name: Nightly

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Run the full Playwright suite
        type: boolean
        default: true
      refs:
        description: JSON list of branches for the full suite
        type: string
        default: '["476", "dev"]'
      timing:
        description: Run season timing
        type: boolean
        default: true
      timing_ref:
        description: Branch for season timing
        type: string
        default: '476'
      seasons:
        description: Seasons per start
        type: number
        default: 4
      only:
        description: Comma-separated start ids (bookmark:scenario), empty for every start
        type: string
        default: ''
      profile:
        description: Record a CPU profile of every season (use with only)
        type: boolean
        default: false
      read_audit:
        description: Capture read counters only; instrumented timings are diagnostic
        type: boolean
        default: false
      comparison_baseline:
        description: Optional baseline revision for paired comparisons against timing_ref
        type: string
        default: ''
      comparison_repeats:
        description: Paired comparison samples per workload (3 to 9)
        type: number
        default: 3

      comparison_subjects:
        description: JSON array of paired workloads (content or bookmark:scenario)
        type: string
        default: '["content","476:mobile_household_476","476:peroz_sasanian_476","1096:yaghi_siyan_1096","1096:bohemond_1096","1204:muhammad_1204"]'

permissions:
  contents: read
  actions: read

jobs:
  comparison:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.comparison_baseline != '' }}
    uses: ./.github/workflows/speed-comparison.yml
    with:
      baseline: ${{ inputs.comparison_baseline }}
      candidate: ${{ inputs.timing_ref }}
      repeats: ${{ fromJSON(format('{0}', inputs.comparison_repeats || 3)) }}
      seasons: ${{ fromJSON(format('{0}', inputs.seasons || 4)) }}
      subjects: ${{ inputs.comparison_subjects || '["content","476:mobile_household_476","476:peroz_sasanian_476","1096:yaghi_siyan_1096","1096:bohemond_1096","1204:muhammad_1204"]' }}

  suite:
    if: ${{ github.event_name == 'schedule' || inputs.suite }}
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(inputs.refs || '["476", "dev"]') }}
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ matrix.ref }}
      label: suite-${{ matrix.ref }}
      mode: all
      projects: all
      shards: 16
      bounded: false

  timing:
    if: ${{ github.event_name == 'schedule' || inputs.timing }}
    uses: ./.github/workflows/season-timing.yml
    with:
      ref: ${{ inputs.timing_ref || '476' }}
      seasons: ${{ fromJSON(format('{0}', inputs.seasons || 4)) }}
      only: ${{ inputs.only || '' }}
      profile: ${{ inputs.profile == true }}
      read_audit: ${{ inputs.read_audit == true }}
      shards: 12
