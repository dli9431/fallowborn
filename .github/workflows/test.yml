name: Test

on:
  workflow_dispatch:

jobs:
  chromium:
    name: Chromium file and served-origin suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install test dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chromium tests
        run: npm run test:chromium
      - name: Upload Playwright report and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  runtime-manifest:
    name: Verify nginx runtime manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build runtime image
        run: docker build --build-arg SOURCE_COMMIT="${GITHUB_SHA}" -t fallowborn-runtime:test .
      - name: Inspect nginx document root
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create fallowborn-runtime:test)"
          trap 'docker rm -f "${container_id}" >/dev/null' EXIT
          mkdir runtime-root
          docker cp "${container_id}:/usr/share/nginx/html/." runtime-root
          node tests/e2e/support/verify-runtime-manifest.js runtime-root

  cross-browser:
    name: Firefox and WebKit served-origin suite
    needs: chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install test dependencies
        run: npm ci
      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit
      - name: Run cross-browser tests
        run: npm run test:cross-browser
      - name: Upload cross-browser report and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-cross-browser
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
